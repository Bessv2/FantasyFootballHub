name: Update league data

# Keeps the hub current without anyone running anything.
#
# Pulls from ESPN, rebuilds the site, and commits only when something actually
# changed. Cloudflare Pages redeploys off that push, so the whole chain is
# hands-off.
#
# Requires two repository secrets (Settings -> Secrets and variables ->
# Actions): ESPN_S2 and ESPN_SWID. See the README.

on:
  schedule:
    # Cron is UTC. Times below are Eastern Standard Time (UTC-5); during
    # daylight time (before early November) each window lands an hour early.
    #
    # Every 30 minutes while games are on:
    #   Thursday 8 PM - midnight   (Fri 01:00-05:00 UTC)
    - cron: '*/30 1-4 * * 5'
    - cron: '0 5 * * 5'
    #   Sunday 10 AM - midnight    (Sun 15:00 - Mon 05:00 UTC)
    - cron: '*/30 15-23 * * 0'
    - cron: '*/30 0-4 * * 1'
    - cron: '0 5 * * 1'
    #   Monday 8 PM - midnight     (Tue 01:00-05:00 UTC)
    - cron: '*/30 1-4 * * 2'
    - cron: '0 5 * * 2'
    #
    # Every 3 hours the rest of the week, skipping hours a window already
    # covers so no slot fires twice. About 96 runs a week (~415 a month),
    # under Cloudflare Pages' free 500 builds with room for manual pushes.
    - cron: '0 */3 * * 3,4,6'
    - cron: '0 0,6-21/3 * * 5'
    - cron: '0 0-12/3 * * 0'
    - cron: '0 6-21/3 * * 1'
    - cron: '0 0,6-21/3 * * 2'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-fetch every week instead of using the cache'
        type: boolean
        default: false

# Needed so the workflow can push its own commit back.
permissions:
  contents: write

concurrency:
  group: update-league-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify credentials are configured
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          if [ -z "$ESPN_S2" ] || [ -z "$ESPN_SWID" ]; then
            echo "::error::Missing ESPN_S2 and/or ESPN_SWID repository secrets."
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Credentials present (espn_s2 is ${#ESPN_S2} chars)."

      # The runner starts clean every time and data/raw/ is gitignored, so the
      # per-player news cache (data/raw/news-cache.json, 6-hour TTL) would be
      # empty on every run without this. Each run saves a new entry; the
      # restore-keys prefer today's newest, then any earlier one. Stale entries
      # are simply refetched, so an old restore is harmless.
      - name: Restore player news cache
        uses: actions/cache@v4
        with:
          path: data/raw/news-cache.json
          key: news-cache-${{ github.run_id }}
          restore-keys: |
            news-cache-

      - name: Fetch from ESPN
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            node scripts/fetch.mjs --force
          else
            node scripts/fetch.mjs
          fi

      - name: Build the site
        run: node scripts/build.mjs

      - name: Run tests
        run: node --test tests/*.test.mjs

      - name: Commit and push if anything changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes — nothing to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          WEEKS=$(node -e "try{console.log(require('./docs/data/hub.json').status.weeksPlayed)}catch{console.log(0)}")
          PHASE=$(node -e "try{console.log(require('./docs/data/hub.json').phase.headline)}catch{console.log('Update')}")

          if [ "$WEEKS" -gt 0 ]; then
            MSG="Week $WEEKS"
          else
            MSG="$PHASE"
          fi

          git commit -m "$MSG [automated]"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Published: $MSG"

      - name: Summary
        if: always()
        run: |
          {
            echo "### League data update"
            echo ""
            if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
              echo "Published new data. Cloudflare Pages will redeploy shortly."
            else
              echo "No changes since the last run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
