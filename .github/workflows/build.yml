name: Build

on:
  schedule:
    - cron: '03 3 * * *'      # 11:59 PM UTC-4 (3:59 AM UTC)
    - cron: '03 15 * * *'     # 11:59 AM UTC-4 (3:59 PM UTC)
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 'latest'
    
    - name: Install dependencies
      run: npm install
    
    - name: Fetch data and build
      run: npm run update
